# File: /app/.github/workflows/build-distroless.yml
# x-lucid-file-path: /app/.github/workflows/build-distroless.yml
# x-lucid-file-directory: /app/.github/workflows
# x-lucid-file-type: YAML
#
# x-files.json alignment (repo path → canonical /app path in runtime images):
#   infrastructure/docker/distroless/base/docker-compose.base.yml → /app/configs/docker/distroless/base/docker-compose.base.yml
#   infrastructure/docker/distroless/base/Dockerfile.base        → same directory as compose (build context: repo root)
#   infrastructure/docker/multi-stage/Dockerfile.{database,storage,vm} → /app/configs/docker/multi-stage/
#   configs/docker/distroless/*.yml                               → /app/configs/docker/distroless/*.yml
#   infrastructure/containers/services/distroless/*.yml           → /app/infrastructure/containers/services/distroless/*.yml
# Registry / image names stay env-driven below (not path-indexed in x-files.json).

name: Multi-Stage Distroless Builds

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Target platform (linux/amd64, linux/arm64, or both)"
        required: true
        default: "linux/amd64,linux/arm64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

env:
  REGISTRY: pickme
  IMAGE_NAME: lucid

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run-base: ${{ steps.changes.outputs.run-base }}
      run-services: ${{ steps.changes.outputs.run-services }}
      services-json: ${{ steps.changes.outputs.services-json }}
      platforms-json: ${{ steps.changes.outputs.platforms-json }}
      build-all: ${{ steps.changes.outputs.build-all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and emit JSON matrices
        id: changes
        run: |
          set -euo pipefail

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="HEAD"
          fi
          changed() { git diff --name-only "$RANGE" | grep -E "$1" >/dev/null 2>&1; }

          # Platforms: workflow_dispatch uses choice; push/PR default to both
          case "${{ github.event.inputs.target_platform || '' }}" in
            linux/amd64) PLATFORMS_JSON='["linux/amd64"]' ;;
            linux/arm64) PLATFORMS_JSON='["linux/arm64"]' ;;
            *) PLATFORMS_JSON='["linux/amd64","linux/arm64"]' ;;
          esac
          {
            echo "platforms-json<<LUCID_JSON_EOF"
            echo "$PLATFORMS_JSON"
            echo "LUCID_JSON_EOF"
          } >> "$GITHUB_OUTPUT"

          RUN_BASE=false
          RUN_SVC=false
          BUILD_ALL=false
          SERVICES_JSON='["database","storage","vm"]'

          # Full stack: shared roots and x-files-indexed distroless policy paths
          if changed '^(src/|pyproject\.toml|requirements.*\.txt|build/|configs/docker/(distroless|multi-stage)/|infrastructure/docker/(distroless/base|multi-stage)/|infrastructure/containers/services/distroless/|\.github/workflows/build-distroless\.yml)'; then
            BUILD_ALL=true
            RUN_BASE=true
            RUN_SVC=true
          else
            if changed '^infrastructure/docker/distroless/base/'; then RUN_BASE=true; fi
            if changed '^infrastructure/docker/multi-stage/'; then RUN_SVC=true; fi
            if changed '^infrastructure/containers/database/'; then RUN_SVC=true; fi
            if changed '^infrastructure/containers/storage/'; then RUN_SVC=true; fi
            if changed '^infrastructure/docker/vm/'; then RUN_SVC=true; fi
          fi

          if [[ "$BUILD_ALL" == true ]]; then
            RUN_BASE=true
            RUN_SVC=true
          fi

          # PR/push with no matched paths: still run distroless matrix (expected CI signal)
          if [[ "$RUN_BASE" == false && "$RUN_SVC" == false ]]; then
            RUN_BASE=true
            RUN_SVC=true
            BUILD_ALL=true
          fi

          {
            echo "services-json<<LUCID_JSON_EOF"
            echo "$SERVICES_JSON"
            echo "LUCID_JSON_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "run-base=$RUN_BASE" >> "$GITHUB_OUTPUT"
          echo "run-services=$RUN_SVC" >> "$GITHUB_OUTPUT"
          echo "build-all=$BUILD_ALL" >> "$GITHUB_OUTPUT"

  build-distroless-base:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.run-base == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.detect-changes.outputs.platforms-json) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distroless base (Dockerfile.base)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/distroless/base/Dockerfile.base
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-multi-stage-services:
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.run-services == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services-json) }}
        platform: ${{ fromJSON(needs.detect-changes.outputs.platforms-json) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }} (multi-stage Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/multi-stage/Dockerfile.${{ matrix.service }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform }}

      - name: Verify image (best-effort; true distroless may lack /bin/sh)
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }} /bin/sh -c "echo ok" \
            || echo "Shell check skipped or failed (expected for some distroless images)."

  security-scan:
    needs: [detect-changes, build-multi-stage-services]
    runs-on: ubuntu-latest
    if: always() && needs.detect-changes.outputs.run-services == 'true' && needs.build-multi-stage-services.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services-json) }}
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results-${{ matrix.service }}.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results-${{ matrix.service }}.sarif"

  optimize-layers:
    needs: [detect-changes, build-multi-stage-services]
    runs-on: ubuntu-latest
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.run-services == 'true' &&
      needs.build-multi-stage-services.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services-json) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run layer optimization
        run: |
          python build/scripts/optimize-layers.py \
            --service "${{ matrix.service }}" \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}"

  build-summary:
    # Only depend on detect-changes so this job is not skipped when build-distroless-base is skipped (run-base=false).
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "## Distroless build summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **run-base:** ${{ needs.detect-changes.outputs.run-base }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **run-services:** ${{ needs.detect-changes.outputs.run-services }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **services (JSON):** \`${{ needs.detect-changes.outputs.services-json }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **platforms (JSON):** \`${{ needs.detect-changes.outputs.platforms-json }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **build-all flag:** ${{ needs.detect-changes.outputs.build-all }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### x-files path index (repo → /app)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base: \`infrastructure/docker/distroless/base/Dockerfile.base\` → \`/app/configs/docker/distroless/base/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Multi-stage: \`infrastructure/docker/multi-stage/Dockerfile.*\` → \`/app/configs/docker/multi-stage/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:${{ github.sha }}\` (if base job ran)" >> "$GITHUB_STEP_SUMMARY"
          for svc in database storage vm; do
            echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/$svc:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          done
