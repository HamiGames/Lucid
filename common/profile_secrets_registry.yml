# File: /app/common/profile_secrets_registry.yml
# x-lucid-file-path: /app/common/profile_secrets_registry.yml
# x-lucid-file-directory: /app/common
# x-lucid-file-type: YAML

# Lucid — contact profile ↔ secrets overlay registry (versioned in repo).
# Base secrets: configs/environment/.env.secrets (gitignored on deploy hosts)
# Overlay:      configs/environment/profiles/<contact_profile_key>/.env.secrets
#
# user_profiles / users collection:
#   contact_profile_key: string — must match a key below (or custom key with matching overlay dir)
#
# Python: common/contact_profile_env.bootstrap_contact_profile_env()
# Env:     LUCID_CONTACT_PROFILE_KEY=admin  (optional; overrides user doc when set)

version: "1.0"
description: Registered contact profiles for credential overlays (not secret values).

contact_profiles:
  admin:
    description: Full ops / wallet / Mongo Redis ES splits (admin point of contact)
    typical_roles: [ADMIN, SUPER_ADMIN]
    user_profiles_field: contact_profile_key

  node_operator:
    description: Node pool and anchoring-related credential scope
    typical_roles: [NODE_OPERATOR]
    user_profiles_field: contact_profile_key

  payment_ops:
    description: TRON / USDT / payout scoped secrets
    typical_roles: [USER]
    user_profiles_field: contact_profile_key

  session_ops:
    description: Session pipeline / storage / API caches
    typical_roles: [USER]
    user_profiles_field: contact_profile_key

  rdp_ops:
    description: RDP controller / monitor scoped secrets
    typical_roles: [USER]
    user_profiles_field: contact_profile_key

environment_variables:
  # Canonical path (prefer in new configs)
  node_operational_config:
    primary: NODE_OPERATIONAL_CONFIG_PATH
    deprecated_alias: OPERATIONAL_CONFIG_PATH
