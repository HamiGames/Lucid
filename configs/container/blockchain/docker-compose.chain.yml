      lucid-blockchain-engine:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3.11
      - -c
      - import socket; s=socket.socket(); s.settimeout(2); r=s.connect_ex(('127.0.0.1',8085)); s.close(); exit(0 if r==0 else
