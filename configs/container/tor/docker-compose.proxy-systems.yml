name: lucid-proxy-systems
x-lucid-host-config:
  file: ../../../infrastructure/containers/host-config.yml
  repo_path: infrastructure/containers/host-config.yml
  version: '1.0'
  description: Lucid container host registry for Docker DNS hostnames, ports, discovery URLs, and static host IPs.
  http_path_template: http://{service_name}:{port}/app
  host_ip_range: 172.20.10.1–172.20.10.76
  in_container_path: /app/configs/host-config.yml
x-repo-context:
  context: ../../../
x-lucid-build-args:
  BUILD_DATE: ${BUILD_DATE:-}
  VCS_REF: ${VCS_REF:-}
  VERSION: ${VERSION:-1.0.0}
  TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
  BUILDPLATFORM: ${BUILDPLATFORM:-linux/amd64}
x-env-proxy: &id001
- ../../../configs/environment/.env.master
- ../../environment/.env.secrets
services:
  tor-proxy:
    image: ${LUCID_TOR_PROXY_IMAGE:-pickme/lucid-tor-proxy:latest-arm64}
    container_name: tor-proxy
    hostname: tor-proxy
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    restart: unless-stopped
    env_file: *id001
    environment:
      TOR_SOCKS_PORT: '9050'
      TOR_CONTROL_PORT: '9051'
    ports:
    - ${TOR_SOCKS_PUBLISH_PORT:-9050}:9050
    - ${TOR_CONTROL_PUBLISH_PORT:-9051}:9051
    networks:
      lucid-pi-network:
        aliases:
        - tor-socks
        - tor-control
      lucid-tor-egress-network:
        ipv4_address: ${LUCID_TOR_EGRESS_TOR_PROXY_IPV4:-172.31.0.2}
    labels:
      com.lucid.service: tor-socks
      com.lucid.expose: 9050,9051
      com.lucid.tor.inherent: 'true'
    volumes:
    - ../../environment/.env.master:/app/configs/.env.master:ro
    - ../../environment/.env.secrets:/app/configs/.env.secrets:ro
  tunnel-tools:
    image: ${LUCID_TUNNEL_TOOLS_IMAGE:-pickme/lucid-tunnel-tools:latest-arm64}
    container_name: tunnel-tools
    hostname: tunnel-tools
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    build:
      context: ../../../
      dockerfile: infrastructure/containers/tor/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-1.0.0}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/amd64}
    restart: unless-stopped
    env_file: *id001
    environment:
      CONTROL_HOST: tor-socks
      CONTROL_PORT: '9051'
      TUNNEL_PORT: '7000'
      TOR_PROXY: tor-socks:9050
    ports:
    - ${TUNNEL_TOOLS_PUBLISH_PORT:-7000}:7000
    networks:
      lucid-pi-network: {}
      lucid-tor-egress-network:
        ipv4_address: ${LUCID_TOR_EGRESS_TUNNEL_TOOLS_IPV4:-172.31.0.3}
    depends_on:
      tor-proxy:
        condition: service_started
    user: 65532:65532
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=128m
    security_opt:
    - no-new-privileges:true
    volumes:
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../environment/.env.secrets:/app/configs/.env.secrets:ro
    labels:
      com.lucid.service: tunnel-tools
      com.lucid.expose: '7000'
      com.lucid.tor.compatible: 'true'
networks:
  lucid-pi-network:
    external: true
    name: lucid-pi-network
  lucid-tor-egress-network:
    external: true
    name: lucid-tor-egress-network
