x-lucid-env-files: &id001
- ../../../configs/environment/.env.master
- ../../environment/.env.secrets
services:
  python-base:
    build:
      context: .
      dockerfile: Dockerfile.python-base
      platforms:
      - linux/amd64
      - linux/arm64
      args:
        BUILDKIT_INLINE_CACHE: 1
        BUILDKIT_PROGRESS: plain
    image: lucid-python-base:latest
    container_name: lucid-python-base
    hostname: lucid-python-base
    env_file: *id001
    volumes:
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - PYTHONUNBUFFERED=1
    - PYTHONDONTWRITEBYTECODE=1
    - LUCID_ENV=dev
    ports:
    - 8000:8000
    - 8080:8080
    - 8081:8081
    healthcheck:
      test:
      - python
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    command:
    - python
    - -c
    - print('Lucid Python Base Container Ready')
    networks:
    - lucid-distroless-dev
  java-base:
    build:
      context: .
      dockerfile: Dockerfile.java-base
      platforms:
      - linux/amd64
      - linux/arm64
      args:
        BUILDKIT_INLINE_CACHE: 1
        BUILDKIT_PROGRESS: plain
    image: lucid-java-base:latest
    container_name: lucid-java-base
    hostname: lucid-java-base
    env_file: *id001
    volumes:
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - LUCID_ENV=dev
    ports:
    - 8080:8080
    - 8081:8081
    - 8082:8082
    healthcheck:
      test:
      - java
      - -version
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    command:
    - java
    - -version
    networks:
    - lucid-distroless-dev
networks:
  lucid-distroless-dev:
    name: lucid-distroless-dev
    driver: bridge
    attachable: true
    ipam:
      config:
      - subnet: 172.29.0.0/16
        gateway: 172.29.0.1
volumes:
  lucid-base-data:
    name: lucid-base-data
    driver: local
