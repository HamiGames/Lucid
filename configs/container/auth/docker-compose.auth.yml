name: lucid-auth
x-lucid-build-args:
  BUILD_DATE: ${BUILD_DATE:-}
  VCS_REF: ${VCS_REF:-}
  VERSION: ${VERSION:-1.0.0}
  TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
  BUILDPLATFORM: ${BUILDPLATFORM:-linux/amd64}
  PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
x-repo-context:
  context: ../../../
x-env-auth: &id001
- ../../../configs/environment/.env.master
- ../../environment/.env.secrets
services:
  lucid-mongodb:
    image: ${LUCID_MONGODB_IMAGE:-pickme/lucid-mongodb:latest-arm64}
    container_name: lucid-mongodb
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    build:
      context: ../../../
      dockerfile: infrastructure/containers/database/Dockerfile.mongodb
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-1.0.0}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/amd64}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
        DEBIAN_MULTIARCH: ${DEBIAN_MULTIARCH:-aarch64-linux-gnu}
    restart: unless-stopped
    networks:
    - lucid-pi-network
    ports:
    - ${LUCID_MONGODB_PUBLISH_PORT:-27017}:27017
    volumes:
    - lucid_auth_mongodb_data:/data/db:rw
    - ../../environment/.env.master:/app/configs/.env.master:ro
    - ../../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-lucid}
    - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD}
    user: 65532:65532
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3.11
      - /app/usr/local/bin/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    env_file:
    - ../../environment/.env.master
    - ../../environment/.env.secrets
  lucid-redis:
    image: ${LUCID_REDIS_IMAGE:-redis:7-alpine}
    container_name: lucid-redis
    restart: unless-stopped
    networks:
    - lucid-pi-network
    ports:
    - ${LUCID_REDIS_PUBLISH_PORT:-6379}:6379
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - lucid_auth_redis_data:/data:rw
    - ../../environment/.env.master:/app/configs/.env.master:ro
    - ../../environment/.env.secrets:/app/configs/.env.secrets:ro
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    env_file:
    - ../../environment/.env.master
    - ../../environment/.env.secrets
  lucid-auth-service:
    image: ${LUCID_AUTH_SERVICE_IMAGE:-pickme/lucid-auth-service:latest-arm64}
    container_name: lucid-auth-service
    hostname: lucid-auth-service
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    build:
      context: ../../../
      dockerfile: infrastructure/containers/auth/Dockerfile.auth-service
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-1.0.0}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/amd64}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    restart: unless-stopped
    networks:
    - lucid-pi-network
    ports:
    - ${LUCID_AUTH_PUBLISH_PORT:-8089}:8089
    env_file: *id001
    environment:
    - LUCID_ENV=${LUCID_ENV:-production}
    - AUTH_SERVICE_HOST=lucid-auth-service
    - AUTH_SERVICE_PORT=8089
    - AUTH_SERVICE_URL=http://lucid-auth-service:8089
    # JWT_SECRET_KEY (compose secrets): used only inside lucid-auth-service for auth token lease signing and introspection — not the api-gateway secret.
    - SERVER_MANAGEMENT_BASE_URL=${SERVER_MANAGEMENT_BASE_URL:-http://lucid-server-manager:8081}
    - SERVER_MANAGEMENT_VERIFY_PATH=${SERVER_MANAGEMENT_VERIFY_PATH:-/app/auth/verify-login}
    - SERVER_MANAGEMENT_PREAUTH_VERIFY_PATH=${SERVER_MANAGEMENT_PREAUTH_VERIFY_PATH:-/app/auth/verify-preauth}
    - SERVER_MANAGEMENT_REGISTRY_PATH=${SERVER_MANAGEMENT_REGISTRY_PATH:-/app/registry/users}
    - SERVER_MANAGEMENT_HTTP_TIMEOUT=${SERVER_MANAGEMENT_HTTP_TIMEOUT:-15}
    - MONGODB_URL=${MONGODB_URL:-mongodb://lucid:${MONGO_INITDB_ROOT_PASSWORD}@lucid-mongodb:27017/lucid?authSource=admin}
    - REDIS_URL=${REDIS_URL:-redis://lucid-redis:6379/0}
    - API_GATEWAY_URL=${API_GATEWAY_URL:-http://api-gateway:8080}
    user: 65532:65532
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=200m
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    volumes:
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - lucid_auth_logs:/app/logs:rw
    - ../../environment/.env.secrets:/app/configs/.env.secrets:ro
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/usr/bin/python3.11
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health', timeout=2); exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
    - com.lucid.phase=foundation
    - com.lucid.service=lucid-auth-service
    - com.lucid.cluster=09-authentication
networks:
  lucid-pi-network:
    name: lucid-pi-network
    external: true
volumes:
  lucid_auth_mongodb_data:
    name: lucid-auth-mongodb-data
  lucid_auth_redis_data:
    name: lucid-auth-redis-data
  lucid_auth_logs:
    name: lucid-auth-logs
secrets:
  MONGODB_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/MONGODB_PASSWORD.secret
  REDIS_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/REDIS_PASSWORD.secret
  JWT_SECRET_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/JWT_SECRET_KEY.secret
  ENCRYPTION_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/ENCRYPTION_KEY.secret
  SESSION_SECRET:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/SESSION_SECRET.secret
  TRON_PRIVATE_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TRON_PRIVATE_KEY.secret
  TRON_API_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TRON_API_KEY.secret
  API_GATEWAY_SECRET:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/API_GATEWAY_SECRET.secret
  ELASTICSEARCH_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/ELASTICSEARCH_PASSWORD.secret
  TOR_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TOR_PASSWORD.secret
  TOR_CONTROL_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TOR_CONTROL_PASSWORD.secret
  WALLET_ENCRYPTION_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/WALLET_ENCRYPTION_KEY.secret
