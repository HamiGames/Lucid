name: lucid-application
services:
  session-pipeline:
    image: pickme/lucid-session-pipeline:latest-arm64
    container_name: session-pipeline
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ../environment/.env.secrets
    networks:
    - lucid-pi-network
    ports:
    - 8083:8083
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/session-pipeline:/app/data:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/session-pipeline:/app/logs:rw
    - session-pipeline-cache:/tmp/pipeline
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - SESSION_PIPELINE_HOST=session-pipeline
    - SESSION_PIPELINE_PORT=8083
    - SESSION_PIPELINE_URL=http://session-pipeline:8083
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL}
    - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=200m
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=session-pipeline
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
  session-recorder:
    image: pickme/lucid-session-recorder:latest-arm64
    container_name: session-recorder
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.session-recorder
    - ../environment/.env.secrets
    networks:
    - lucid-pi-network
    ports:
    - 8090:8090
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/session-recorder/recordings:/app/recordings:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/session-recorder/chunks:/app/chunks:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/session-recorder:/app/logs:rw
    - session-recorder-cache:/tmp/recorder
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - SESSION_RECORDER_HOST=session-recorder
    - SESSION_RECORDER_PORT=8090
    - SESSION_RECORDER_URL=http://session-recorder:8090
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL}
    - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=200m
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=session-recorder
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
  session-processor:
    image: pickme/lucid-chunk-processor:latest-arm64
    container_name: session-processor
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.session-processor
    - ../environment/.env.secrets
    networks:
    - lucid-pi-network
    ports:
    - 8091:8091
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/session-processor:/app/data:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/session-processor:/app/logs:rw
    - session-processor-cache:/tmp/processor
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - SESSION_PROCESSOR_HOST=session-processor
    - SESSION_PROCESSOR_PORT=8091
    - SESSION_PROCESSOR_URL=http://session-processor:8091
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL}
    - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
    - API_GATEWAY_URL=${API_GATEWAY_URL}
    - BLOCKCHAIN_ENGINE_URL=${BLOCKCHAIN_ENGINE_URL}
    - NODE_MANAGEMENT_URL=${NODE_MANAGEMENT_URL}
    - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
    - SESSION_PIPELINE_URL=http://session-pipeline:8083
    - SESSION_RECORDER_URL=http://session-recorder:8090
    - SESSION_STORAGE_URL=http://session-storage:8020
    - SESSION_API_URL=http://session-api:8113
    - LUCID_COMPRESSION_PATH=/app/data/compression
    - LUCID_MANIFEST_PATH=/app/data/manifests
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=200m
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3.11
      - -c
      - import socket; s = socket.socket(); s.settimeout(2); result = s.connect_ex(('127.0.0.1', 8091)); s.close(); exit(0
        if result == 0 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=session-processor
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
  session-storage:
    image: pickme/lucid-session-storage-service:latest-arm64
    container_name: session-storage
    hostname: session-storage-service
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.session-storage
    - ../environment/.env.secrets
    networks:
    - lucid-pi-network
    ports:
    - 8020:8020
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/session-storage:/app/data:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/session-storage:/app/logs:rw
    - session-storage-cache:/tmp/storage
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - SESSION_STORAGE_HOST=session-storage
    - SESSION_STORAGE_PORT=8020
    - SESSION_STORAGE_URL=http://session-storage:8020
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL}
    - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=200m
    healthcheck:
      test:
      - CMD
      - /app/usr/bin/python3.11
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=session-storage
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
      lucid-elasticsearch:
        condition: service_started
  session-api:
    image: pickme/lucid-session-api:latest-arm64
    container_name: session-api
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.session-api
    - ../environment/.env.secrets
    networks:
    - lucid-pi-network
    - lucid-tor-egress-network
    ports:
    - 8113:8113
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/session-api:/app/data:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/session-api:/app/logs:rw
    - session-api-cache:/tmp/api
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - SESSION_API_HOST=session-api
    - SESSION_API_PORT=8113
    - SESSION_API_URL=http://session-api:8113
    - RDP_CONTROLLER_URL=http://rdp-controller:8092
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL}
    - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
    - API_GATEWAY_URL=${API_GATEWAY_URL}
    - BLOCKCHAIN_ENGINE_URL=${BLOCKCHAIN_ENGINE_URL}
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3.11
      - -c
      - import socket; s = socket.socket(); s.settimeout(2); result = s.connect_ex(('127.0.0.1', 8113)); s.close(); exit(0
        if result == 0 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=session-api
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      tor-proxy:
        condition: service_healthy
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_started
      api-gateway:
        condition: service_healthy
      blockchain-engine:
        condition: service_started
  rdp-server-manager:
    image: pickme/lucid-rdp-server-manager:latest-arm64
    container_name: rdp-server-manager
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.rdp-server-manager
    - ../environment/.env.secrets
    networks:
    - lucid-pi-network
    ports:
    - 8081:8081
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/rdp-server-manager:/app/data:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/rdp-server-manager:/app/logs:rw
    - rdp-server-manager-cache:/tmp/server-manager
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - RDP_SERVER_MANAGER_HOST=${RDP_SERVER_MANAGER_HOST:-rdp-server-manager}
    - RDP_SERVER_MANAGER_PORT=8081
    - RDP_SERVER_MANAGER_URL=http://rdp-server-manager:8081
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL:?REDIS_URL not set}
    - API_GATEWAY_URL=${API_GATEWAY_URL:-http://api-gateway:8080}
    - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://lucid-auth-service:8089}
    - PORT_RANGE_START=${PORT_RANGE_START:-13389}
    - PORT_RANGE_END=${PORT_RANGE_END:-14389}
    - MAX_CONCURRENT_SERVERS=${MAX_CONCURRENT_SERVERS:-50}
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3.11
      - -c
      - import os, socket; s = socket.socket(); s.settimeout(2); port = int(os.getenv('RDP_SERVER_MANAGER_PORT', '8081'));
        result = s.connect_ex(('127.0.0.1', port)); s.close(); exit(0 if result == 0 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=rdp-server-manager
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      tor-proxy:
        condition: service_started
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
  rdp-xrdp:
    image: pickme/lucid-rdp-xrdp:latest-arm64
    container_name: rdp-xrdp
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.rdp-xrdp
    - ../environment/.env.secrets
    networks:
      lucid-pi-network: {}
    ports:
    - ${XRDP_PORT:-3389}:3389
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/rdp-xrdp/config:/app/config:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/rdp-xrdp:/app/logs:rw
    - rdp-xrdp-cache:/tmp/xrdp
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - RDP_XRDP_HOST=${RDP_XRDP_HOST:-rdp-xrdp}
    - XRDP_PORT=3389
    - RDP_XRDP_URL=http://rdp-xrdp:3389
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL}
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=rdp-xrdp
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      tor-proxy:
        condition: service_started
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
      rdp-server-manager:
        condition: service_healthy
  rdp-controller:
    image: pickme/lucid-rdp-controller:latest-arm64
    container_name: rdp-controller
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ../environment/.env.secrets
    networks:
      lucid-pi-network: {}
      lucid-tor-egress-network: {}
    ports:
    - 8092:8092
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/rdp-controller:/app/data:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/rdp-controller:/app/logs:rw
    - rdp-controller-cache:/tmp/controller
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - RDP_CONTROLLER_HOST=rdp-controller
    - RDP_CONTROLLER_PORT=8092
    - RDP_CONTROLLER_URL=http://rdp-controller:8092
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL:?REDIS_URL not set}
    - TRUST_STORAGE_PATH=/app/data/rdp/trust
    - TRUST_CERTIFICATE_PATH=/app/data/rdp/certificates
    - TRUST_POLICY_PATH=/app/data/rdp/policies
    - LUCID_STORAGE_PATH=/app/data
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3.11
      - -c
      - import socket; s = socket.socket(); s.settimeout(2); result = s.connect_ex(('127.0.0.1', 8092)); s.close(); exit(0
        if result == 0 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=rdp-controller
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      tor-proxy:
        condition: service_started
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
      rdp-server-manager:
        condition: service_healthy
  rdp-monitor:
    image: pickme/lucid-rdp-monitor:latest-arm64
    container_name: rdp-monitor
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.core
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.application
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.rdp-monitor
    - ../environment/.env.secrets
    networks:
    - lucid-pi-network
    ports:
    - 8093:8093
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/rdp-monitor:/app/logs:rw
    - rdp-monitor-cache:/tmp/monitor
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - RDP_MONITOR_HOST=rdp-monitor
    - RDP_MONITOR_PORT=8093
    - RDP_MONITOR_URL=http://rdp-monitor:8093
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
