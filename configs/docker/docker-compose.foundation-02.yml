name: lucid-foundation
services:
  tor-proxy:
    image: pickme/lucid-tor-proxy:latest-arm64
    container_name: tor-proxy
    restart: unless-stopped
    env_file:
    - /app/configs/.env.master
    - ../environment/.env.secrets
    networks:
      lucid-pi-network: {}
      lucid-tor-egress-network:
        ipv4_address: ${LUCID_TOR_EGRESS_TOR_PROXY_IPV4:-172.31.0.2}
    ports:
    - ${TOR_PROXY_SOCKS_PORT:-9050}:${TOR_PROXY_SOCKS_PORT:-9050}
    - ${TOR_PROXY_CONTROL_PORT:-9051}:${TOR_PROXY_CONTROL_PORT:-9051}
    - ${TOR_PROXY_HTTP_PORT:-8888}:${TOR_PROXY_HTTP_PORT:-8888}
    entrypoint:
    - /opt/bin/tini
    - --
    command:
    - /app/02_network_security/tor/entrypoint.sh
    volumes:
    - tor-config:/app/configs:rw
    - tor-logs:/app/logs/tor:rw
    - onion-state:/app/run/lucid/onion:rw
    - tor-state:/app/run/lucid/tor:rw
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    healthcheck:
      test:
      - CMD
      - /app/02_network_security/tor/bin/tor-health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    labels:
    - lucid.service=tor-proxy
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.cluster=foundation
  lucid-server-tools:
    image: pickme/lucid-server-tools:latest-arm64
    container_name: lucid-server-tools
    restart: unless-stopped
    env_file:
    - /app/configs/.env.master
    - ../environment/.env.secrets
    depends_on:
      tor-proxy:
        condition: service_started
      lucid-redis:
        condition: service_healthy
    networks:
    - lucid-pi-network
    volumes:
    - /app/logs/server-tools:/app/logs/tunnel:rw
    - onion-state:/app/run/lucid/onion:rw
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    healthcheck:
      test:
      - CMD
      - /app/usr/bin/python3.11
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
    - lucid.service=server-tools
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.cluster=foundation
  lucid-service-mesh-controller:
    image: pickme/lucid-service-mesh-controller:latest-arm64
    container_name: lucid-service-mesh-controller
    restart: unless-stopped
    env_file:
    - /app/configs/.env.master
    - ../environment/.env.secrets
    environment:
    - PYTHONPATH=/app/service-mesh-controller:/app/usr/local/lib/python3.11/site-packages
    - SERVICE_MESH_CONFIG_PATH=/app/configs
    - SERVICE_MESH_CONTEXT_PATH=/app/service-mesh
    networks:
    - lucid-pi-network
    volumes:
    - /app/logs/service-mesh:/app/logs/service-mesh:rw
    - /app/infrastructure/service-mesh/config:/app/configs:ro
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    depends_on:
      tor-proxy:
        condition: service_started
      lucid-redis:
        condition: service_healthy
    labels:
    - lucid.service=service-mesh-controller
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.cluster=foundation
  lucid-mongodb:
    image: pickme/lucid-mongodb:latest-arm64
    container_name: lucid-mongodb
    restart: unless-stopped
    env_file:
    - /app/configs/.env.master
    - ../environment/.env.secrets
    environment:
    - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USERNAME}
    - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    - MONGO_INITDB_DATABASE=${MONGODB_MAIN_DATABASE:-lucid}
    - MONGODB_PASSWORD=${MONGODB_PASSWORD:?MONGODB_PASSWORD not set}
    - MONGODB_PORT=${MONGODB_PORT:-27017}
    ports:
    - ${MONGODB_PORT}:${MONGODB_PORT}
    networks:
    - lucid-pi-network
    depends_on:
      tor-proxy:
        condition: service_started
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=200m
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/mongodb:/data/db:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/mongodb:/var/log/mongodb:rw
    - mongodb-cache:/var/cache/mongodb
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    healthcheck:
      test:
      - CMD
      - /opt/bin/python3.11
      - /opt/lucid/mongodb/bin/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
    - lucid.service=mongodb
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.cluster=foundation
  lucid-redis:
    image: pickme/lucid-redis:latest-arm64
    container_name: lucid-redis
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.distroless
    - ../environment/.env.secrets
    ports:
    - ${REDIS_PORT}:${REDIS_PORT}
    networks:
    - lucid-pi-network
    depends_on:
      tor-proxy:
        condition: service_started
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/redis:/data:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/redis:/var/log/redis:rw
    - redis-cache:/var/cache/redis
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    environment:
    - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    - REDIS_HOST=${REDIS_HOST:-lucid-redis}
    - REDIS_PORT=${REDIS_PORT:-6379}
    - REDIS_MAX_MEMORY=${REDIS_MAX_MEMORY:-512mb}
    - REDIS_MAX_MEMORY_POLICY=${REDIS_MAX_MEMORY_POLICY:-allkeys-lru}
    labels:
    - lucid.service=redis
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.cluster=foundation
  lucid-elasticsearch:
    image: pickme/lucid-elasticsearch:latest-arm64
    container_name: lucid-elasticsearch
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.distroless
    - ../environment/.env.secrets
    ports:
    - ${ELASTICSEARCH_HTTP_PORT:-9200}:${ELASTICSEARCH_HTTP_PORT:-9200}
    - ${ELASTICSEARCH_TRANSPORT_PORT:-9300}:${ELASTICSEARCH_TRANSPORT_PORT:-9300}
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    networks:
    - lucid-pi-network
    depends_on:
      tor-proxy:
        condition: service_started
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:size=200m
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/data/elasticsearch:/usr/share/elasticsearch/data:rw
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/elasticsearch:/usr/share/elasticsearch/logs:rw
    - elasticsearch-cache:/tmp/elasticsearch
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    healthcheck:
      test:
      - CMD
      - /opt/bin/curl
      - -f
      - http://localhost:9200/_cluster/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
    - lucid.service=elasticsearch
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.cluster=foundation
  lucid-auth-service:
    image: pickme/lucid-auth-service:latest-arm64
    container_name: lucid-auth-service
    restart: unless-stopped
    env_file:
    - ../environment/.env.master
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.foundation
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.tor-proxy
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.authentication
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/configs/environment/.env.distroless
    - ../environment/.env.secrets
    networks:
    - lucid-pi-network
    - lucid-tor-egress-network
    ports:
    - ${AUTH_SERVICE_PORT:-8089}:${AUTH_SERVICE_PORT:-8089}
    depends_on:
      tor-proxy:
        condition: service_healthy
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
    environment:
    - PYTHONPATH=/app/auth:/opt/lib/python3.11/site-packages
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:?MONGODB_PASSWORD not set}@lucid-mongodb:27017/lucid_auth?authSource=admin
    - MONGODB_DATABASE=lucid_auth
    - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
    - JWT_ALGORITHM=HS256
    - REDIS_URI=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD not set}@lucid-redis:6379/1
    - API_GATEWAY_URL=${API_GATEWAY_URL:?API_GATEWAY_URL not set}
    - TOR_PROXY_HOST=${TOR_PROXY_HOST:-tor-proxy}
    - TOR_PROXY_SOCKS_PORT=${TOR_PROXY_SOCKS_PORT:-9050}
    - TOR_PROXY_CONTROL_PORT=${TOR_PROXY_CONTROL_PORT:-9051}
    - TOR_PROXY_HTTP_PORT=${TOR_PROXY_HTTP_PORT:-8888}
    - SOCKS5_PROXY=socks5://${TOR_PROXY_HOST:-tor-proxy}:${TOR_PROXY_SOCKS_PORT:-9050}
    - HTTP_PROXY=http://${TOR_PROXY_HOST:-tor-proxy}:${TOR_PROXY_HTTP_PORT:-8888}
    - HTTPS_PROXY=http://${TOR_PROXY_HOST:-tor-proxy}:${TOR_PROXY_HTTP_PORT:-8888}
    - NO_PROXY=lucid-mongodb,lucid-redis,lucid-auth-service,lucid-api-gateway
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    volumes:
    - ${LUCID_REPO_ROOT:-${PROJECT_ROOT:-/mnt/myssd/Lucid/Lucid}}/logs/auth:/tmp/lucid/auth:rw
    - auth-cache:/tmp/auth
    - ../environment/.env.master:/app/configs/.env.master:ro
    - ../environment/.env.secrets:/app/configs/.env.secrets:ro
    healthcheck:
      test:
      - CMD
      - /opt/bin/python3.11
      - -c
      - import os, urllib.request, sys; port=os.getenv('AUTH_SERVICE_PORT','8089'); resp=urllib.request.urlopen(f'http://localhost:{port}/health',
        timeout=5); sys.exit(0 if resp.getcode()==200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=auth-service
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.cluster=foundation
volumes:
  mongodb-cache:
    driver: local
    name: lucid-mongodb-cache
  redis-cache:
    driver: local
    name: lucid-redis-cache
  elasticsearch-cache:
    driver: local
    name: lucid-elasticsearch-cache
  auth-cache:
    driver: local
    name: lucid-auth-cache
  tor-config:
    name: lucid-tor-config
  tor-state:
    name: lucid-tor-state
networks:
  lucid-pi-network:
    external: true
    name: lucid-pi-network
  lucid-tor-egress-network:
    external: true
    name: lucid-tor-egress-network
secrets:
  MONGODB_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/MONGODB_PASSWORD.secret
  REDIS_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/REDIS_PASSWORD.secret
  JWT_SECRET_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/JWT_SECRET_KEY.secret
  ENCRYPTION_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/ENCRYPTION_KEY.secret
  SESSION_SECRET:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/SESSION_SECRET.secret
  TRON_PRIVATE_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TRON_PRIVATE_KEY.secret
  TRON_API_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TRON_API_KEY.secret
  API_GATEWAY_SECRET:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/API_GATEWAY_SECRET.secret
  ELASTICSEARCH_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/ELASTICSEARCH_PASSWORD.secret
  TOR_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TOR_PASSWORD.secret
  TOR_CONTROL_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TOR_CONTROL_PASSWORD.secret
  WALLET_ENCRYPTION_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/WALLET_ENCRYPTION_KEY.secret
