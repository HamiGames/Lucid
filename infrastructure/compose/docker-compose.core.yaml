services:
  lucid-mongodb:
    image: pickme/lucid-mongodb:latest-arm64
    container_name: lucid-mongodb
    hostname: lucid-mongodb
    platform: linux/arm64
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - MONGO_INITDB_ROOT_USERNAME=lucid
    - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    - MONGO_INITDB_DATABASE=lucid
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD}@lucid-mongodb:27017/lucid?authSource=admin
    - MONGODB_HOST=172.20.0.11
    - MONGODB_PORT=27017
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/mongodb:/app/data/db:rw
    - /mnt/myssd/Lucid/Lucid/logs/mongodb:/app/var/log/mongodb:rw
    - mongo_config:/data/configdb
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network:
        ipv4_address: 172.20.0.11
    ports:
    - 27017:27017
    healthcheck:
      test:
      - CMD-SHELL
      - 'mongosh --quiet -u lucid -p ${MONGODB_PASSWORD} --authenticationDatabase admin --eval ''db.runCommand({ ping: 1 }).ok''
        | grep -q 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    labels:
    - lucid.service=mongodb
    - lucid.type=foundation
    - lucid.platform=arm64
    - lucid.cluster=core
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
  lucid-redis:
    image: pickme/lucid-redis:latest-arm64
    container_name: lucid-redis
    hostname: lucid-redis
    platform: linux/arm64
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - REDIS_URL=redis://lucid-redis:6379/0
    - REDIS_HOST=172.20.0.12
    - REDIS_PORT=6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/redis:/app/data:rw
    - /mnt/myssd/Lucid/Lucid/logs/redis:/app/var/log/redis:rw
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network:
        ipv4_address: 172.20.0.12
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    labels:
    - lucid.service=redis
    - lucid.type=foundation
    - lucid.platform=arm64
    - lucid.cluster=core
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
  lucid-elasticsearch:
    image: pickme/lucid-elasticsearch:latest-arm64
    container_name: lucid-elasticsearch
    hostname: lucid-elasticsearch
    platform: linux/arm64
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - ELASTICSEARCH_URI=http://lucid-elasticsearch:9200
    - ELASTICSEARCH_HOST=172.20.0.13
    - ELASTICSEARCH_HTTP_PORT=9200
    - ELASTICSEARCH_TRANSPORT_PORT=9300
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/elasticsearch:/app/usr/share/elasticsearch/data:rw
    - /mnt/myssd/Lucid/Lucid/logs/elasticsearch:/app/usr/share/elasticsearch/logs:rw
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network:
        ipv4_address: 172.20.0.13
    ports:
    - 9200:9200
    - 9300:9300
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9200/_cluster/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    labels:
    - lucid.service=elasticsearch
    - lucid.type=foundation
    - lucid.platform=arm64
    - lucid.cluster=core
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
  lucid-tor-proxy:
    image: pickme/lucid-tor-proxy:latest-arm64
    container_name: lucid-tor-proxy
    hostname: lucid-tor-proxy
    platform: linux/arm64
    pull_policy: always
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - TOR_SOCKS_PORT=9050
    - TOR_CONTROL_PORT=9051
    - TOR_CONTROL_PASSWORD=${TOR_CONTROL_PASSWORD}
    - ONION_COUNT=5
    - TOR_DATA_DIR=/app/var/lib/tor
    - TOR_COOKIE_TARGETS=/app/run/lucid/onion/control_auth_cookie
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/tor:/app/var/lib/tor:rw
    - /mnt/myssd/Lucid/Lucid/data/onion:/app/run/lucid/onion:rw
    - /mnt/myssd/Lucid/Lucid/logs/tor:/var/log/tor:rw
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
    - lucid-pi-network
    ports:
    - 9050:9050
    - 9051:9051
    healthcheck:
      test:
      - CMD-SHELL
      - /usr/local/bin/tor-health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    labels:
    - lucid.service=tor-proxy
    - lucid.type=core
    - lucid.platform=arm64
    - lucid.cluster=core
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
  lucid-api-server:
    image: pickme/lucid-api-server:latest-arm64
    container_name: lucid-api-server
    hostname: lucid-api-server
    platform: linux/arm64
    pull_policy: always
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - API_HOST=0.0.0.0
    - API_PORT=8081
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - ELASTICSEARCH_URI=http://lucid-elasticsearch:9200
    - API_GATEWAY_URL=http://lucid-api-gateway:8080
    - TOR_SOCKS=tor-proxy:9050
    - TOR_CONTROL_PORT=9051
    - ONION_DIR=/app/run/lucid/onion
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/onion:/app/run/lucid/onion:ro
    - /mnt/myssd/Lucid/Lucid/logs/api-server:/app/logs:rw
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
    - lucid-pi-network
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
      lucid-tor-proxy:
        condition: service_healthy
    ports:
    - 8081:8081
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8081/health || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    labels:
    - lucid.service=api-server
    - lucid.type=core
    - lucid.platform=arm64
    - lucid.cluster=core
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
  lucid-api-gateway:
    image: pickme/lucid-api-gateway:latest-arm64
    container_name: lucid-api-gateway
    hostname: lucid-api-gateway
    platform: linux/arm64
    pull_policy: always
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - API_UPSTREAM=http://lucid-api-server:8081
    - GATEWAY_PORT=8080
    - API_GATEWAY_URL=http://lucid-api-gateway:8080
    - API_GATEWAY_HOST=172.20.0.10
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    - SSL_ENABLED=true
    - RATE_LIMIT_PER_MINUTE=1000
    - CORS_ALLOWED_ORIGINS=*
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/onion:/app/run/lucid/onion:ro
    - /mnt/myssd/Lucid/Lucid/logs/api-gateway:/app/logs:rw
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network:
        ipv4_address: 172.20.0.10
    depends_on:
    - lucid-api-server
    - lucid-mongodb
    - lucid-redis
    ports:
    - 8080:8080
    - 8081:8081
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    labels:
    - lucid.service=api-gateway
    - lucid.type=core
    - lucid.platform=arm64
    - lucid.cluster=core
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
  lucid-tunnel-tools:
    image: pickme/lucid-tunnel-tools:latest-arm64
    container_name: lucid-tunnel-tools
    hostname: lucid-tunnel-tools
    platform: linux/arm64
    pull_policy: always
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - TUNNEL_PORT=7000
    - TUNNEL_MODE=client
    - TOR_SOCKS=tor-proxy:9050
    - ONION_DIR=/app/run/lucid/onion
    - COOKIE_FILE_SHARED=/app/run/lucid/onion/control_auth_cookie
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/onion:/app/run/lucid/onion:rw
    - /mnt/myssd/Lucid/Lucid/data/tunnel:/app/run/lucid/tunnel:rw
    - /mnt/myssd/Lucid/Lucid/logs/tunnel-tools:/app/logs:rw
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
    - lucid-pi-network
    depends_on:
    - lucid-tor-proxy
    - lucid-api-server
    ports:
    - 7000:7000
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3.11
      - -c
      - import socket; s = socket.socket(); s.settimeout(2); result = s.connect_ex(('tor-proxy', 9051)); s.close(); exit(0
        if result == 0 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    labels:
    - lucid.service=tunnel-tools
    - lucid.type=core
    - lucid.platform=arm64
    - lucid.cluster=core
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
  lucid-server-tools:
    image: pickme/lucid-server-tools:latest-arm64
    container_name: lucid-server-tools
    hostname: lucid-server-tools
    platform: linux/arm64
    pull_policy: always
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLANE=ops
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - ONION_DIR=/app/run/lucid/onion
    - TUNNEL_DATA_DIR=/var/lib/tunnel
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/onion:/app/run/lucid/onion:ro
    - /mnt/myssd/Lucid/Lucid/data/tunnel:/var/lib/tunnel:ro
    - /mnt/myssd/Lucid/Lucid/logs/server-tools:/app/logs:rw
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
    - lucid-pi-network
    depends_on:
    - lucid-tor-proxy
    - lucid-mongodb
    - lucid-api-server
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/lucid/scripts/health-check.sh || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.05'
    labels:
    - lucid.service=server-tools
    - lucid.type=core
    - lucid.platform=arm64
    - lucid.cluster=core
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
networks:
  lucid-pi-network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.20.0.0/16
        gateway: 172.20.0.1
  lucid-tron-isolated:
    driver: bridge
    ipam:
      config:
      - subnet: 172.26.0.0/16
        gateway: 172.26.0.1
  lucid-gui-network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.27.0.0/16
        gateway: 172.27.0.1
volumes:
  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/myssd/Lucid/Lucid/data/mongodb
  mongo_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/myssd/Lucid/Lucid/data/mongodb-config
secrets:
  MONGODB_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/MONGODB_PASSWORD.secret
  REDIS_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/REDIS_PASSWORD.secret
  JWT_SECRET_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/JWT_SECRET_KEY.secret
  ENCRYPTION_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/ENCRYPTION_KEY.secret
  SESSION_SECRET:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/SESSION_SECRET.secret
  TRON_PRIVATE_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TRON_PRIVATE_KEY.secret
  TRON_API_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TRON_API_KEY.secret
  API_GATEWAY_SECRET:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/API_GATEWAY_SECRET.secret
  ELASTICSEARCH_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/ELASTICSEARCH_PASSWORD.secret
  TOR_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TOR_PASSWORD.secret
  TOR_CONTROL_PASSWORD:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/TOR_CONTROL_PASSWORD.secret
  WALLET_ENCRYPTION_KEY:
    file: C:/Users/surba/Desktop/personal/THE_FUCKER/lucid_2/Lucid/configs/secrets/runtime/compose/WALLET_ENCRYPTION_KEY.secret
