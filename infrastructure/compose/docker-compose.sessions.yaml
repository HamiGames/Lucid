services:
  lucid-session-chunker:
    image: pickme/lucid-session-chunker:latest-arm64
    container_name: lucid-session-chunker
    hostname: lucid-session-chunker
    platform: linux/arm64
    restart: unless-stopped
    env_file:
    - ../../configs/environment/.env.master
    - ../../configs/environment/.env.secrets
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - CHUNK_SIZE_MB=8
    - COMPRESSION_LEVEL=3
    - CHUNKER_PORT=8090
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - SESSION_CHUNK_SIZE=10485760
    - SESSION_COMPRESSION_LEVEL=6
    - CHUNKER_URL=http://lucid-session-chunker:8090
    - API_GATEWAY_URL=http://lucid-api-gateway:8080
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    volumes:
    - ../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../infrastructure/containers/services:/app/service_configs:ro
    - ../../infrastructure/containers/host-config.yml:/app/configs/host-config.yml:ro
    - /mnt/myssd/Lucid/Lucid/data/sessions:/data/sessions:rw
    - /mnt/myssd/Lucid/Lucid/logs/session-chunker:/app/logs:rw
    - session-chunker-cache:/tmp/chunker
    - ../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network:
        ipv4_address: 172.20.0.20
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
    ports:
    - 8090:8090
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8090/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    labels:
    - lucid.service=session-chunker
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=sessions
