    volumes:
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
  lucid-vm:
    image: ${LUCID_VM_IMAGE:-pickme/lucid-vm:latest-arm64}
    container_name: lucid-vm
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/arm64}
    build:
      context: ../../../
      dockerfile: infrastructure/containers/vm/Dockerfile.vm
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-1.0.0}
        TARGETPLATFORM: ${TARGETPLATFORM:-linux/arm64}
        BUILDPLATFORM: ${BUILDPLATFORM:-linux/amd64}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    restart: unless-stopped
    networks:
    - lucid-pi-network
    ports:
    - ${LUCID_VM_PUBLISH_PORT:-8107}:8107
    env_file: *id001
    environment:
    - BLOCKCHAIN_ENGINE_URL=http://lucid-blockchain-engine:8084
    - AUTH_SERVICE_URL=http://lucid-auth-service:8089
    depends_on:
      lucid-blockchain-engine:
        condition: service_healthy
      lucid-auth-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /opt/venv/bin/python
      - -c
      - import sys; sys.exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
networks:
  lucid-pi-network:
    external: true
    name: lucid-pi-network
volumes:
  lucid_manager_mongodb_data:
    name: lucid-manager-mongodb-data
  lucid_manager_redis_data:
    name: lucid-manager-redis-data
  lucid_manager_engine_data: null
  lucid_manager_engine_logs: null
  lucid_manager_data_chain_data: null
  lucid_manager_data_chain_logs: null
  lucid_manager_block_manager_data: null
  lucid_manager_block_manager_logs: null
