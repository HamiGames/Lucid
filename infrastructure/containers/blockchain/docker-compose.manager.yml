    env_file: *id001
    environment:
    - MONGODB_URL=${MONGODB_URL:-mongodb://lucid:${MONGO_INITDB_ROOT_PASSWORD}@lucid-mongodb:27017/lucid?authSource=admin}
    - BLOCKCHAIN_ENGINE_URL=http://lucid-blockchain-engine:8084
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-blockchain-engine:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3
      - -c
      - import socket; s=socket.socket(); s.settimeout(2); r=s.connect_ex(('127.0.0.1',8040)); s.close(); exit(0 if r==0 else
        1)
      interval: 30s
      timeout: 10s
      retries: 3
