version: '1.0'
description: >
  Conventional service bundle index for rdp-controller. Refs below mirror the alignment
  manifest for this compose service. Cross-check infrastructure/containers/host-config.yml and x-files.json.

x-lucid-calibration:
  source_host_config: infrastructure/containers/host-config.yml
  source_x_files: x-files.json
  bundle_repo_path: infrastructure/containers/services/rdp-controller.yml
  bundle_container_path: /app/service_configs/rdp-controller.yml
  alignment_manifest_tool: scripts/gui_auth_realignment/list_service_files_by_name.py

compose_service: "rdp-controller"
associated_needles:
  - "rdp-controller"
  - "rdp_controller"

manifest_alignment:
  yml_refs:
    - "configs/container/rdp/docker-compose.rdp-system.yml"
    - "configs/docker/docker-compose.all.yml"
    - "configs/docker/docker-compose.application.yml"
    - "configs/services/gui-docker-manager.yml"
    - "infrastructure/containers/host-config.yml"
    - "infrastructure/containers/rdp/docker-compose.rdp-system.yml"
    - "infrastructure/containers/services/rdp/controller-config.yaml"
    - "infrastructure/containers/services/rdp/monitor-config.yaml"
    - "infrastructure/containers/services/rdp/xrdp-config.yaml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/allocation_manifest.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/core-cluster-host-alignment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/processing-cluster-host-alignment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/storage-cluster-host-alignment.yml"
    - "infrastructure/containers/user/docker-compose.user-services.yml"
  json_refs:
    - "configs/x-files.json"
    - "infrastructure/containers/config-listings.json"
    - "infrastructure/containers/dockerfile_layout_run_report.json"
    - "infrastructure/containers/dockerfile_recalibration_map.json"
    - "infrastructure/containers/dockerfile_recalibration_map_REPAIRED.json"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/allocation_manifest.json"
  py_refs:
    - "common/load_host_config.py"
