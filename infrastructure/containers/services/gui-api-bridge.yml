# File: /app/service_configs/gui-api-bridge.yml
# x-lucid-file-path: /app/service_configs/gui-api-bridge.yml
# x-lucid-file-directory: /app/service_configs
# x-lucid-file-type: YAML
# Lucid alignment: host_registry=infrastructure/containers/host-config.yml (container /app/configs/host-config.yml); path_index=x-files.json section_to_canonical

# Runtime (container): /app/service_configs/gui-api-bridge.yml — see container-runtime-layout.yml
# GUI API Bridge Service Configuration
# Bridges Electron GUI with backend API services
# Implements service discovery and API routing
# Listen: gui-api-bridge:8203 (gui_api_bridge @ infrastructure/containers/host-config.yml)
#
# GUI token realignment — required call chain for Tier A:
#   *-interface → gui-api-bridge → api-gateway → lucid-auth-service (never direct to lucid-auth-service from Tier A).
# Forward on every request: client metadata JSON (non-secret), X-Lucid-Calling-Service, Authorization Bearer when present.
# Do not treat this service as the authority for login validity; gateway + auth-service + server-manager enforce policy.

config_files:
  secrets: ../../configs/environment/.env.secrets
  master: /app/configs/.env.master

service:
  name: gui-api-bridge
  version: "1.0.0"
  description: "API bridge service for Electron GUI integration"
  cluster: gui-integration
  phase: gui

# API Configuration
api:
  version: "v1"
  base_path: "/api/v1"
  timeout: 30000
  retry_attempts: 3
  retry_delay: 1000

# Service Discovery
discovery:
  enabled: true
  method: "consul"
  consul:
    host: "lucid-service-mesh-controller"
    port: 8500
    datacenter: "lucid-dc"
    service_name: "gui-api-bridge"
    health_check_interval: "30s"
    health_check_timeout: "10s"

# Backend Service Endpoints
backend_services:
  api_gateway:
    name: "api-gateway"
    url: "http://api-gateway:8080"
    health_check: "/health"
    timeout: 30000
    retry_attempts: 3

  blockchain_core:
    name: "blockchain-engine"
    url: "http://blockchain-engine:8084"
    health_check: "/health"
    timeout: 30000
    retry_attempts: 3

  # Direct lucid-auth-service URL is for emergency ops / health probes only — not for Tier A user login routing.
  auth_service:
    name: "lucid-auth-service"
    url: "http://lucid-auth-service:8089"
    health_check: "/health"
    timeout: 30000
    retry_attempts: 3
    tier_a_user_traffic: false
    use_api_gateway_instead: "http://api-gateway:8080"

  session_api:
    name: "session-api"
    url: "http://session-api:8113"
    health_check: "/health"
    timeout: 30000
    retry_attempts: 3

  node_management:
    name: "node-management"
    url: "http://node-management:8095"
    health_check: "/health"
    timeout: 30000
    retry_attempts: 3

  admin_interface:
    name: "admin-ui-backend"
    url: "http://admin-ui-backend:8120"
    health_check: "/health"
    timeout: 30000
    retry_attempts: 3

  tron_payment:
    name: "tron-client"
    url: "http://tron-client:8091"
    health_check: "/health"
    timeout: 30000
    retry_attempts: 3

# API Routing Configuration (auth-bearing traffic goes through api_gateway only)
routing:
  user:
    prefix: "/api/v1/user"
    allowed_methods: ["GET", "POST"]
    rate_limit: 100
    services:
      - api_gateway
      - session_api

  developer:
    prefix: "/api/v1/developer"
    allowed_methods: ["GET", "POST", "PUT", "DELETE"]
    rate_limit: 500
    services:
      - api_gateway
      - session_api
      - blockchain_core

  node:
    prefix: "/api/v1/node"
    allowed_methods: ["GET", "POST", "PUT"]
    rate_limit: 200
    services:
      - api_gateway
      - node_management

  admin:
    prefix: "/api/v1/admin"
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
    rate_limit: 1000
    services:
      - api_gateway
      - admin_interface
      - blockchain_core
      - node_management

forwarding:
  required_headers:
    - "X-Lucid-Calling-Service"
  optional_headers:
    - "Authorization"
    - "X-Lucid-Correlation-Id"
  client_metadata: "JSON body or dedicated header per bridge implementation; never store secrets in Tier A manifests."

# Authentication Configuration
authentication:
  enabled: true
  method: "forwarding"
  note: "Bridge forwards Bearer to api-gateway; local JWT decode is discouraged for Tier A — gateway introspects via lucid-auth-service."
  jwt_forward_only:
    secret_key_env: "JWT_SECRET_KEY"
    access_token_expiry: 900
    refresh_token_expiry: 604800
    issuer: "lucid-gui-api-bridge"
    audience: "lucid-gui"
    deprecated_local_validation: "Prefer gateway → auth introspection per gui_token_auth_realignment."

# Authorization Configuration
authorization:
  enabled: true
  rbac:
    enabled: true
    roles:
      user:
        permissions: ["read:own_sessions", "create:session", "read:own_profile"]
      developer:
        permissions: ["read:all_sessions", "create:session", "update:session", "read:blockchain"]
      node_operator:
        permissions: ["read:node_status", "update:node_config", "read:earnings"]
      admin:
        permissions: ["*"]

# Rate Limiting Configuration
rate_limiting:
  enabled: true
  redis_url: "redis://lucid-redis:6379/1"
  default_limit: 100  # requests per minute
  burst_limit: 20
  window_size: 60  # seconds

# CORS Configuration
cors:
  enabled: true
  allowed_origins:
    - "http://localhost:*"
    - "https://localhost:*"
    - "file://*"  # For Electron apps
  allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowed_headers: ["Content-Type", "Authorization", "X-Requested-With", "X-Lucid-Calling-Service", "X-Lucid-Correlation-Id"]
  allow_credentials: true

# Logging Configuration
logging:
  level: "info"
  format: "json"
  file: "/app/logs/gui-api-bridge.log"
  max_size: "10MB"
  max_files: 5
  fields:
    service: "gui-api-bridge"
    version: "1.0.0"

# Monitoring Configuration
monitoring:
  enabled: true
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
    interval: "30s"
  
  health_checks:
    enabled: true
    interval: "30s"
    timeout: "10s"
    retries: 3

  tracing:
    enabled: true
    jaeger_endpoint: "http://jaeger:14268/api/traces"
    sample_rate: 0.1

# Security Configuration
security:
  ssl:
    enabled: false  # Handled by reverse proxy
    cert_file: "/app/certs/server.crt"
    key_file: "/app/certs/server.key"

  headers:
    enabled: true
    content_security_policy: "default-src 'self'"
    x_frame_options: "DENY"
    x_content_type_options: "nosniff"
    x_xss_protection: "1; mode=block"

# Performance Configuration
performance:
  compression:
    enabled: true
    level: 6
    threshold: 1024  # bytes

  caching:
    enabled: true
    redis_url: "redis://lucid-redis:6379/2"
    default_ttl: 300  # seconds
    max_ttl: 3600  # seconds

  connection_pooling:
    enabled: true
    max_connections: 100
    max_idle_connections: 10
    connection_timeout: 30000
    idle_timeout: 60000

# Error Handling Configuration
error_handling:
  enabled: true
  log_errors: true
  error_format: "json"
  include_stack_trace: false
  
  custom_errors:
    - code: "LUCID_ERR_5001"
      message: "GUI API Bridge internal error"
      status: 500
    - code: "LUCID_ERR_5002"
      message: "Backend service unavailable"
      status: 503
    - code: "LUCID_ERR_5003"
      message: "Service discovery failed"
      status: 503

# WebSocket Configuration
websocket:
  enabled: true
  path: "/ws"
  ping_interval: 30  # seconds
  pong_timeout: 10  # seconds
  max_connections: 1000

# File Upload Configuration
file_upload:
  enabled: true
  max_file_size: "100MB"
  allowed_types: ["application/octet-stream", "text/plain"]
  upload_path: "/tmp/uploads"
  cleanup_interval: "1h"

# Configuration Validation
validation:
  enabled: true
  strict_mode: true
  validate_requests: true
  validate_responses: false  # Backend handles response validation
