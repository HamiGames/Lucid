version: '1.0'
description: >
  Conventional service bundle index for lucid-server-manager. Refs below mirror the alignment
  manifest for this compose service. Cross-check infrastructure/containers/host-config.yml and x-files.json.

x-lucid-calibration:
  source_host_config: infrastructure/containers/host-config.yml
  source_x_files: x-files.json
  bundle_repo_path: infrastructure/containers/services/server/lucid-server-manager.yml
  bundle_container_path: /app/service_configs/server/lucid-server-manager.yml
  alignment_manifest_tool: scripts/gui_auth_realignment/list_service_files_by_name.py

compose_service: "lucid-server-manager"
associated_needles:
  - "lucid-server-manager"
  - "lucid_server_manager"

manifest_alignment:
  yml_refs:
    - "configs/container/auth/docker-compose.auth.yml"
    - "configs/container/server/docker-compose.server-external.yml"
    - "infrastructure/containers/host-config.yml"
    - "infrastructure/containers/server/docker-compose.server-external.yml"
    - "infrastructure/containers/services/admin/admin-interface.yml"
    - "infrastructure/containers/services/api-gateway.yml"
    - "infrastructure/containers/services/middle-ware/auth-service.yml"
    - "infrastructure/containers/services/gui/gui-docker-manager-service-groups.yml"
    - "infrastructure/containers/services/gui/gui-docker-manager.yml"
    - "infrastructure/containers/services/middle-ware/master-endpoint.yml"
    - "infrastructure/containers/services/rdp/rdp-services.yml"
    - "infrastructure/containers/services/rdp/server-manager-config.yaml"
    - "infrastructure/containers/services/service-discovery.yml"
    - "infrastructure/containers/services/payment_services/tron-payment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/allocation_manifest.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/core-cluster-host-alignment.yml"
  json_refs:
    - "infrastructure/containers/config-listings.json"
    - "infrastructure/containers/dockerfile_recalibration_map.json"
    - "infrastructure/containers/dockerfile_recalibration_map_REPAIRED.json"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/allocation_manifest.json"
  py_refs:
    - "common/load_host_config.py"
