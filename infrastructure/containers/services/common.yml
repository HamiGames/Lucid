# File: /app/service_configs/common.yml
# x-lucid-file-path: /app/service_configs/common.yml
# x-lucid-file-directory: /app/service_configs
# x-lucid-file-type: YAML
# Lucid alignment: host_registry=infrastructure/containers/host-config.yml (container /app/configs/host-config.yml); path_index=x-files.json section_to_canonical
#
# compose_service=common; YAML/JSON/Python lists from alignment manifest (list_service_files_by_name.py).

version: '1.0'
description: >
  Conventional service bundle index for common. Refs below mirror the alignment
  manifest for this compose service. Cross-check infrastructure/containers/host-config.yml and x-files.json.

x-lucid-calibration:
  source_host_config: infrastructure/containers/host-config.yml
  source_x_files: x-files.json
  bundle_repo_path: infrastructure/containers/services/common.yml
  bundle_container_path: /app/service_configs/common.yml
  alignment_manifest_tool: scripts/gui_auth_realignment/list_service_files_by_name.py

compose_service: "common"
associated_needles:
  - "common"

manifest_alignment:
  yml_refs:
    - "configs/logging/elasticsearch-logging.yml"
    - "infrastructure/containers/blockchain/config/block-pay-endpoints.yml"
    - "infrastructure/containers/host-config.yml"
    - "infrastructure/containers/services/logging/elasticsearch-logging.yml"
    - "infrastructure/containers/services/master-endpoint.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/allocation_manifest.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/application-cluster-host-alignment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/core-cluster-host-alignment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/foundation-cluster-host-alignment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/gui-integration-cluster-host-alignment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/monitoring-cluster-host-alignment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/payment-cluster-host-alignment.yml"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/processing-cluster-host-alignment.yml"
  json_refs:
    - "configs/x-files.json"
    - "infrastructure/containers/.devcontainer/devcontainer.json"
    - "infrastructure/containers/config-listings.json"
    - "infrastructure/containers/dockerfile_recalibration_map.json"
    - "infrastructure/containers/dockerfile_recalibration_map_REPAIRED.json"
    - "infrastructure/containers/services/service_mesh/mtls.json"
    - "infrastructure/containers/services/x_lucid_cluster_calibration/allocation_manifest.json"
  py_refs:
    - "common/load_host_config.py"
