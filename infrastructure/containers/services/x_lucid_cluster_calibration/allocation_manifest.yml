x-lucid-allocation-manifest:
  version: '1.0'
  repo_root: C:\Users\surba\Desktop\personal\THE_FUCKER\lucid_2\Lucid
  sources:
    host_config: infrastructure/containers/host-config.yml
    ports_txt: ports.txt
    x_files_listing: x-files-listing.txt
    x_files_json: x-files.json
    prefix_rules: infrastructure/containers/_gen_x_lucid_cluster_calibration.py CLUSTER_APP_PREFIXES
  clusters:
  - application
  - core
  - database
  - foundation
  - gui-integration
  - monitoring
  - payment
  - processing
  - storage
gui_token_auth_sm_alignment:
  plan_references:
  - gui_token_auth_realignment (Tier A–E, wallet floor rule, anchors)
  - auth_sm_alignment_script (pre_auth_token, registry, credential grant naming)
  canonical_anchors:
    ports_authority: ports.txt (published/container ports; scripts/auth_sm_realignment/step_verify_anchors.py)
    service_registry: infrastructure/containers/host-config.yml
    path_index: x-files.json (section_to_canonical; optional)
    tier_a_mat: configs/alignment-mats/gui-services.json
    tier_a_json_allowlist: scripts/gui_auth_realignment/tier_a_json_targets.json
    automation_auth_sm: scripts/auth_sm_realignment/runtime_auth_sm_apply.py
  terminology:
    registration_key_store: lucid-mongodb user document (user_id + registration_key); not session-api
      / session-pipeline / RDP session plane
    auth_issuance: auth token lease / credential grant (JWT access+refresh); avoid calling lucid-auth-service
      issuance a desktop session
    client_metadata_tier_a: 'Tier A *.json: machine/context metadata + bootstrap URLs only; no Bearer,
      no registration_key, no SM pre_auth_token on disk'
  network_call_chain:
    tier_a_login_and_api: '*-interface → gui-api-bridge (lucid-gui-api-bridge) → api-gateway (8080) →
      lucid-auth-service (never direct Tier A → auth)'
    auth_verification_sm: 'lucid-auth-service → lucid-server-manager (8081): pre_auth verify, registry,
      registration_key / hash handshake per APIs'
    wallet_floor_rule: 'GUI wallet: Tier A → bridge → gateway → lucid-auth-service first; gateway never
      reaches payment-systems; SM reaches C10 only after auth wallet-allow'
    gateway_trust: api-gateway validates end-user Bearer via POST /auth/token/introspect on lucid-auth-service;
      JWT_SECRET_KEY on auth signs leases + introspect
  host_config_keys_core:
    B1_api_gateway: main_lucid_gateway
    B2_lucid_auth_service: lucid_auth_service
    B3_lucid_server_manager: lucid_server_manager
    A4_gui_api_bridge: gui_api_bridge
  sm_auth_surface: 'RDP/server_manager/main.py: e.g. POST /app/auth/preauth-token, /app/auth/verify-preauth,
    /app/registry/users; extended verify-login'
  compose_env_pointer: configs/container/auth/docker-compose.auth.yml (SERVER_MANAGEMENT_* / SM URL)
  non_goals:
  - Manifest / mat JSON alignment is for repo CI URLs and ids only, not end-user authentication.
  - Do not add Tier A .env* or persist secrets in Tier A *.json.
  - Do not edit repo .gitignore from auth_sm script package.
