# File: /app/service_configs/master-endpoint.yml
# x-lucid-file-path: /app/service_configs/master-endpoint.yml
# x-lucid-file-directory: /app/service_configs
# x-lucid-file-type: YAML
# Lucid alignment: host_registry=infrastructure/containers/host-config.yml (container /app/configs/host-config.yml); path_index=x-files.json section_to_canonical

# infrastructure/containers/services/master-endpoint.yml
# Aggregates endpoint sources; service registry mirrors host-config.yml; paths cross-checked to x-files.json section_to_canonical.

version: '1.0'
description: 'Master endpoint index: endpoint_source_files use repo paths with container_path from x-files.json; services block mirrors infrastructure/containers/host-config.yml.'
x-lucid-calibration:
  source_host_config: infrastructure/containers/host-config.yml
  source_x_files: x-files.json
  master_index_repo_path: infrastructure/containers/services/master-endpoint.yml
  description: Host registry (host-config.yml) plus canonical /app paths from x-files.json for this index.
x-lucid-host-config:
  repo_path: infrastructure/containers/host-config.yml
  in_container_path: /app/configs/host-config.yml
  source: ports.txt
  ip_source: service-ip.txt
  http_path_template: http://${service_name}:${port}/app
  host_ip_range: 172.20.10.1–172.20.10.76
meta:
  host_config_path: infrastructure/containers/host-config.yml
  host_config_container_path: /app/configs/host-config.yml
  x_files_repo_path: x-files.json
  source: ports.txt
  ip_source: service-ip.txt
  http_path_template: http://${service_name}:${port}/app
  master_index_path: infrastructure/containers/services/master-endpoint.yml
  master_index_container_path: /app/service_configs/master-endpoint.yml
  endpoint_source_files:
  - path: admin/config/admin-endpoints.yml
    container_path: /app/admin/config/admin-endpoints.yml
    scope: admin-plane HTTP bases, cross-service
  - path: auth/config/endpoints.yaml
    container_path: /app/auth/config/endpoints.yaml
    scope: lucid-auth-service route catalog (/app prefix)
  - path: configs/integration/master-integration-config.yml
