name: lucid-devcontainer
networks:
  lucid-dev_lucid_net:
    name: lucid-dev_lucid_net
    driver: bridge
    attachable: true
    ipam:
      config:
      - subnet: 172.20.0.0/16
        gateway: 172.20.0.1
x-lucid-env-files: &id001
- ../../../configs/environment/.env.master
- ../../../configs/environment/.env.secrets
volumes:
  docker-data:
    name: lucid-devcontainer_docker_data
    driver: local
  buildx-data:
    name: lucid-devcontainer_buildx_data
    driver: local
services:
  devcontainer:
    build:
      context: ../../..
      dockerfile: infrastructure/containers/.devcontainer/Dockerfile
      target: final
      platforms:
      - linux/amd64
      args:
        BUILDKIT_INLINE_CACHE: 1
        BUILDKIT_PROGRESS: plain
    image: pickme/lucid:devcontainer-dind
    container_name: lucid-devcontainer
    hostname: lucid-dev
    env_file: *id001
    privileged: true
    security_opt:
    - seccomp:unconfined
    - apparmor:unconfined
    environment:
    - DOCKER_BUILDKIT=1
    - DOCKER_DEFAULT_PLATFORM=linux/amd64
    - COMPOSE_DOCKER_CLI_BUILD=1
    - DOCKER_HOST=unix:///var/run/docker.sock
    - DOCKER_TLS_CERTDIR=
    - LUCID_ENV=dev
    - PYTHONUNBUFFERED=1
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONPATH=/mnt/myssd/Lucid
    - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - MAVEN_HOME=/usr/share/maven
    - GRADLE_HOME=/usr/share/gradle
    - NODE_ENV=development
    - SSH_HOST=pickme@192.168.0.75
    - SSH_PORT=22
    volumes:
    - type: bind
      source: ../../..
      target: /mnt/myssd/Lucid
      consistency: cached
    - type: bind
      source: ../../../configs/environment/.env.master
      target: /app/configs/.env.master
      read_only: true
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    - docker-data:/var/lib/docker
    - buildx-data:/root/.docker/buildx
    - type: bind
      source: ${USERPROFILE:-~}/.ssh
      target: /root/.ssh
      read_only: true
    - type: bind
      source: ${USERPROFILE:-~}/.gitconfig
      target: /root/.gitconfig
      read_only: true
    - type: tmpfs
      target: /tmp/build
      tmpfs:
        size: 2G
    - type: bind
      source: ../../../configs/environment/.env.secrets
      target: /app/configs/.env.secrets
      read_only: true
    ports:
    - 2222:2222
    - 8080:8080
    - 8081:8081
    - 8082:8082
    - 9050:9050
    - 9051:9051
    - 27017:27017
    networks:
      lucid-dev_lucid_net:
        ipv4_address: 172.20.0.10
    command:
    - /usr/local/bin/start-dev
    - tail
    - -f
    - /dev/null
    working_dir: /mnt/myssd/Lucid
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '6.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test:
      - CMD-SHELL
      - docker info >/dev/null 2>&1 && docker buildx ls | grep -q lucid-pi
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
