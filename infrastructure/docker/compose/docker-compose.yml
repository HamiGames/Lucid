x-lucid-host-config:
  file: ../../containers/host-config.yml
  repo_path: infrastructure/containers/host-config.yml
  version: '1.0'
  description: Lucid container host registry for Docker DNS hostnames, ports, discovery URLs, and static host IPs.
  http_path_template: http://{service_name}:{port}/app
  host_ip_range: 172.20.10.1–172.20.10.76
  in_container_path: /app/configs/host-config.yml
services:
  lucid-mongodb:
    image: pickme/lucid-mongodb:latest-arm64
    container_name: lucid-mongodb
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 27017:27017
    volumes:
    - mongodb_data:/data/db
    - mongodb_config:/data/configdb
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGO_INITDB_ROOT_USERNAME=lucid
    - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD:?MONGODB_PASSWORD not set}
    - MONGO_INITDB_DATABASE=lucid
    - MONGODB_PASSWORD=${MONGODB_PASSWORD:?MONGODB_PASSWORD not set}
    - MONGODB_PORT=27017
    healthcheck:
      test:
      - CMD
      - /app/usr/bin/python3
      - /app/usr/local/bin/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-redis:
    image: pickme/lucid-redis:latest-arm64
    container_name: lucid-redis
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 6379:6379
    volumes:
    - redis_data:/data
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-elasticsearch:
    image: pickme/lucid-elasticsearch:latest-arm64
    container_name: lucid-elasticsearch
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 9200:9200
    - 9300:9300
    volumes:
    - elasticsearch_data:/app/usr/share/elasticsearch/data
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test:
      - CMD
      - /app/usr/bin/curl
      - -f
      - http://lucid-elasticsearch:9200/_cluster/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-auth-service:
    image: pickme/lucid-auth-service:latest-arm64
    container_name: lucid-auth-service
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8089:8089
    volumes:
    - auth_logs:/app/logs
    - auth_data:/app/data
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:?MONGODB_PASSWORD not set}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    - JWT_ALGORITHM=HS256
    - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
    - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8089/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-api-gateway:
    image: pickme/lucid-api-gateway:latest-arm64
    container_name: lucid-api-gateway
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8080:8080
    - 8081:8081
    volumes:
    - api_logs:/app/logs
    - api_data:/app/data
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - ELASTICSEARCH_URI=http://lucid-elasticsearch:9200
    - AUTH_SERVICE_URL=http://lucid-auth-service:8089
    - RATE_LIMIT_ENABLED=true
    - RATE_LIMIT_REQUESTS_PER_MINUTE=100
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
      lucid-auth-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-service-mesh-controller:
    image: pickme/lucid-service-mesh-controller:latest-arm64
    container_name: lucid-service-mesh-controller
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8500:8500
    - 8501:8501
    - 8502:8502
    - 8600:8600
    - 8088:8088
    volumes:
    - service_mesh_data:/app/data
    - service_mesh_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - CONSUL_BIND_INTERFACE=eth0
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8088/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-blockchain-engine:
    image: pickme/lucid-blockchain-engine:latest-arm64
    container_name: lucid-blockchain-engine
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8084:8084
    volumes:
    - blockchain_data:/app/blockchain
    - blockchain_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - BLOCKCHAIN_NETWORK=lucid-mainnet
    - BLOCKCHAIN_CONSENSUS=PoOT
    - ANCHORING_ENABLED=true
    - BLOCK_INTERVAL=10
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8084/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-session-anchoring:
    image: pickme/lucid-session-anchoring:latest-arm64
    container_name: lucid-session-anchoring
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8085:8085
    volumes:
    - anchoring_data:/app/anchoring
    - anchoring_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - BLOCKCHAIN_ENGINE_URL=http://lucid-blockchain-engine:8084
    depends_on:
      lucid-blockchain-engine:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8085/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-block-manager:
    image: pickme/lucid-block-manager:latest-arm64
    container_name: lucid-block-manager
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8086:8086
    volumes:
    - block_manager_data:/app/blocks
    - block_manager_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - BLOCKCHAIN_ENGINE_URL=http://lucid-blockchain-engine:8084
    depends_on:
      lucid-blockchain-engine:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8086/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-data-chain:
    image: pickme/lucid-data-chain:latest-arm64
    container_name: lucid-data-chain
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8087:8087
    volumes:
    - data_chain_data:/app/chain
    - data_chain_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - BLOCKCHAIN_ENGINE_URL=http://lucid-blockchain-engine:8084
    depends_on:
      lucid-blockchain-engine:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3
      - -c
      - import os, urllib.request; port = os.getenv('DATA_CHAIN_PORT', '8087'); urllib.request.urlopen(f'http://localhost:{port}/health',
        timeout=5).read(); exit(0)
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-session-pipeline:
    image: pickme/lucid-session-pipeline:latest-arm64
    container_name: lucid-session-pipeline
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8083:8083
    volumes:
    - session_pipeline_data:/app/pipeline
    - session_pipeline_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - SESSION_CHUNK_SIZE=10485760
    - SESSION_COMPRESSION_LEVEL=6
    depends_on:
      lucid-api-gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8083/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-session-recorder:
    image: pickme/lucid-session-recorder:latest-arm64
    container_name: lucid-session-recorder
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8090:8090
    volumes:
    - session_recorder_data:/app/recordings
    - session_recorder_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - SESSION_TIMEOUT=1800
    depends_on:
      lucid-session-pipeline:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8090/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-chunk-processor:
    image: pickme/lucid-chunk-processor:latest-arm64
    container_name: lucid-chunk-processor
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8010:8010
    volumes:
    - chunk_processor_data:/app/chunks
    - chunk_processor_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    depends_on:
      lucid-session-pipeline:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8010/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-session-storage:
    image: pickme/lucid-session-storage-service:latest-arm64
    container_name: lucid-session-storage
    hostname: session-storage-service
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8020:8020
    volumes:
    - session_storage_data:/app/storage
    - session_storage_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URL=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    - ELASTICSEARCH_URI=http://lucid-elasticsearch:9200
    depends_on:
      lucid-session-pipeline:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /app/usr/bin/python3.11
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-session-api:
    image: pickme/lucid-session-api:latest-arm64
    container_name: lucid-session-api
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8113:8113
    volumes:
    - session_api_data:/app/sessions
    - session_api_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    depends_on:
      lucid-session-pipeline:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8113/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-rdp-server-manager:
    image: pickme/lucid-rdp-server-manager:latest-arm64
    container_name: lucid-rdp-server-manager
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8090:8090
    - 8001:8001
    volumes:
    - rdp_server_data:/app/rdp
    - rdp_server_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8090/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  lucid-rdp-xrdp:
    image: pickme/lucid-rdp-xrdp:latest-arm64
    container_name: lucid-rdp-xrdp
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 3350:3350
    - 3351:3351
    volumes:
    - rdp_xrdp_data:/app/xrdp
    - rdp_xrdp_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
    environment:
    - MONGODB_URI=mongodb://lucid:${MONGODB_PASSWORD:-lucid}@lucid-mongodb:27017/lucid?authSource=admin
    - REDIS_URL=redis://lucid-redis:6379/0
    depends_on:
      lucid-rdp-server-manager:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3350/health
      interval: 30s
      timeout: 10s
      retries: 3
    env_file:
    - ../../../configs/environment/.env.master
    - ../../../configs/environment/.env.secrets
  rdp-controller:
    image: pickme/lucid-rdp-controller:latest-arm64
    container_name: rdp-controller
    restart: unless-stopped
    platform: linux/arm64
    env_file:
    - /app/configs/.env.master
    - /app/configs/.env.application
    - ../../configs/environment/.env.secrets
    - /app/configs/.env.rdp-controller
    ports:
    - ${RDP_CONTROLLER_PORT:-8092}:${RDP_CONTROLLER_PORT:-8092}
    volumes:
    - /mnt/myssd/Lucid/Lucid/data/rdp-controller:/app/data:rw
    - /mnt/myssd/Lucid/Lucid/logs/rdp-controller:/app/logs:rw
    - rdp-controller-cache:/tmp/controller
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
      lucid-tor-egress-network: {}
    environment:
    - LUCID_ENV=production
    - LUCID_PLATFORM=arm64
    - PROJECT_ROOT=/mnt/myssd/Lucid/Lucid
    - RDP_CONTROLLER_HOST=rdp-controller
    - RDP_CONTROLLER_PORT=${RDP_CONTROLLER_PORT:-8092}
    - RDP_CONTROLLER_URL=http://rdp-controller:${RDP_CONTROLLER_PORT:-8092}
    - MONGODB_URL=${MONGODB_URL:?MONGODB_URL not set}
    - REDIS_URL=${REDIS_URL:?REDIS_URL not set}
    - RDP_SERVER_MANAGER_URL=${RDP_SERVER_MANAGER_URL:-http://lucid-rdp-server-manager:8090}
    - SESSION_RECORDER_URL=${SESSION_RECORDER_URL:-http://lucid-session-recorder:8090}
    - SESSION_PROCESSOR_URL=${SESSION_PROCESSOR_URL:-http://session-processor:8091}
    user: 65532:65532
    security_opt:
    - no-new-privileges:true
    - seccomp:unconfined
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test:
      - CMD
      - /usr/bin/python3.11
      - -c
      - import socket; s = socket.socket(); s.settimeout(2); result = s.connect_ex(('127.0.0.1', 8092)); s.close(); exit(0
        if result == 0 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
    - lucid.service=rdp-controller
    - lucid.type=distroless
    - lucid.platform=arm64
    - lucid.security=hardened
    - lucid.cluster=application
    depends_on:
      lucid-mongodb:
        condition: service_healthy
      lucid-redis:
        condition: service_healthy
      lucid-rdp-server-manager:
        condition: service_healthy
  lucid-rdp-monitor:
    image: pickme/lucid-rdp-monitor:latest-arm64
    container_name: lucid-rdp-monitor
    restart: unless-stopped
    platform: linux/arm64
    ports:
    - 8201:8201
    volumes:
    - rdp_monitor_data:/app/monitor
    - rdp_monitor_logs:/app/logs
    - ../../../configs/environment/.env.master:/app/configs/.env.master:ro
    - ../../../configs/environment/.env.secrets:/app/configs/.env.secrets:ro
    networks:
      lucid-pi-network: {}
