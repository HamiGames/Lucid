# Repo path: infrastructure/docker/compose/mongodb/mongod.conf
# x-files.json section_to_canonical: infrastructure/docker/compose/mongodb/mongod.conf → /app/configs/docker/compose/mongodb/mongod.conf
# Canonical (image layout): /app/configs/docker/compose/mongodb/mongod.conf
# Referenced from: infrastructure/docker/compose/docker-compose*.yml
# host-config.yml: lucid_mongodb / service_name lucid-mongodb, port 27017

# MongoDB Configuration File

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0

# Storage
storage:
  dbPath: /data/db
  journal:
    enabled: true

# System Log
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen

# Process Management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Security
security:
  authorization: enabled

# Operation Profiling
operationProfiling:
  slowOpThresholdMs: 100
  mode: slowOp

# Replication (if needed)
# replication:
#   replSetName: "lucid-replica-set"
